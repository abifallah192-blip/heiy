<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Blur Video dengan Gestur 2 Jari</title>
<style>
  body {
    margin: 0;
    background: #111;
    color: #fff;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 { font-size: 18px; font-weight: 500; margin-bottom: 8px; }
  p.status {
    font-size: 14px;
    margin-bottom: 12px;
    padding: 6px 14px;
    border-radius: 20px;
    background: #222;
  }
  p.status.blur-on { background: #7a2e2e; }
  .video-wrap {
    position: relative;
    width: 640px;
    max-width: 95vw;
  }
  video, canvas {
    width: 100%;
    border-radius: 12px;
    display: block;
  }
  video { display: none; }
  canvas {
    background: #000;
  }
</style>
</head>
<body>

<h1>Blur otomatis saat gestur 2 jari (peace sign)</h1>
<p class="status" id="status">Memuat model deteksi tangan...</p>

<div class="video-wrap">
  <video id="video" playsinline></video>
  <canvas id="canvas" width="640" height="480"></canvas>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mediapipe/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script>
const videoEl = document.getElementById('video');
const canvasEl = document.getElementById('canvas');
const ctx = canvasEl.getContext('2d');
const statusEl = document.getElementById('status');

let isBlurred = false;

// Landmark index MediaPipe Hands:
// 0 pergelangan, 4 ujung jempol, 8 ujung telunjuk, 12 ujung tengah,
// 16 ujung manis, 20 ujung kelingking. Setiap jari juga punya sendi "PIP"
// (6,10,14,18) untuk mengecek apakah jari lurus/terangkat.
function isFingerUp(landmarks, tipIdx, pipIdx) {
  return landmarks[tipIdx].y < landmarks[pipIdx].y;
}

function detectTwoFingerPose(landmarks) {
  const indexUp = isFingerUp(landmarks, 8, 6);
  const middleUp = isFingerUp(landmarks, 12, 10);
  const ringDown = !isFingerUp(landmarks, 16, 14);
  const pinkyDown = !isFingerUp(landmarks, 20, 18);

  // Gestur "2 jari": telunjuk + tengah terangkat, manis + kelingking turun
  return indexUp && middleUp && ringDown && pinkyDown;
}

function onResults(results) {
  ctx.save();
  ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);

  let poseDetected = false;
  if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
    for (const landmarks of results.multiHandLandmarks) {
      if (detectTwoFingerPose(landmarks)) {
        poseDetected = true;
      }
    }
  }

  isBlurred = poseDetected;

  ctx.filter = isBlurred ? 'blur(18px)' : 'none';
  ctx.drawImage(results.image, 0, 0, canvasEl.width, canvasEl.height);
  ctx.filter = 'none';

  if (isBlurred) {
    statusEl.textContent = 'Gestur 2 jari terdeteksi — video diblur';
    statusEl.classList.add('blur-on');
  } else {
    statusEl.textContent = 'Menunggu gestur 2 jari...';
    statusEl.classList.remove('blur-on');
  }

  ctx.restore();
}

const hands = new Hands({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
  maxNumHands: 2,
  modelComplexity: 1,
  minDetectionConfidence: 0.6,
  minTrackingConfidence: 0.6
});

hands.onResults(onResults);

const camera = new Camera(videoEl, {
  onFrame: async () => {
    await hands.send({ image: videoEl });
  },
  width: 640,
  height: 480
});

camera.start()
  .then(() => {
    statusEl.textContent = 'Menunggu gestur 2 jari...';
  })
  .catch((err) => {
    statusEl.textContent = 'Gagal mengakses kamera: ' + err.message;
  });
</script>

</body>
</html>
